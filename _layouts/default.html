<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != "/" %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} — {{ site.tagline }}{% endif %}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="site-title" href="{{ '/' | relative_url }}"><img src="{{ '/media/2015/07/bil-white-500.png' | relative_url }}" alt="BIL" class="site-logo"></a>
      <nav class="site-nav">
        <a href="{{ '/events/' | relative_url }}">Events</a>
        <a href="{{ '/speakers/' | relative_url }}">Speakers</a>
        <a href="{{ '/talks/' | relative_url }}">Talks</a>
        <a href="{{ '/press/' | relative_url }}">Press</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a href="{{ '/tenets/' | relative_url }}">Tenets</a>
        <a href="{{ '/host-a-bil/' | relative_url }}">Host a BIL</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p><strong>BIL</strong> — the unconference for people changing the world in big ways.</p>
      <p class="archive-note">Site restored from the original bilconference.com. Events span 2008–2018 across five continents.</p>
    </div>
  </footer>
</body>
</html>
