# BIL backronym word bank.
#
# "BIL doesn't necessarily stand for anything... What's your definition?
#  B______. I______. L________" — BILconference/BIL docs repo.
#
# Seeded from expansions found in the archive ("Brilliant Instant Lust",
# "Breathtaking Intentional Love" — BIL:LA 2016 event copy) and the
# conference's Bill & Ted roots, then extrapolated in the same spirit.
# Convention: b and i hold modifiers, l holds mostly nouns, so a random
# B + I + L pick reads as a plausible expansion.

