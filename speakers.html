---
layout: page
title: Speakers
permalink: /speakers/
---
<p>{{ site.speakers.size }} speakers from BIL events around the world, including the <a href="{{ '/2015/speakers/' | relative_url }}">BIL 2015 Vancouver roster</a>.</p>
<div class="filter-bar" data-filter-items=".people-grid .person" data-filter-placeholder="Filter speakers by name"></div>
<div class="people-grid">
  {% assign speakers = site.speakers | sort: "title" %}
  {% for s in speakers %}
  <a class="person" href="{{ s.url | relative_url }}">
    <img src="{{ s.photo | default: '/assets/img/blank-person.png' | replace: '/media/', '/media/thumbs/' | relative_url }}" alt="{{ s.title }}" loading="lazy">
    <span>{{ s.title }}</span>
  </a>
  {% endfor %}
</div>
