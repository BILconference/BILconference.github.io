{% comment %}Thumbnail card linking to a talk page. Pass talk=<talk doc>.{% endcomment %}
{% include youtube-id.html url=include.talk.youtube %}
<a class="video-card" href="{{ include.talk.url | relative_url }}">
  {% if vid != "" %}<img src="https://i.ytimg.com/vi/{{ vid }}/hqdefault.jpg" alt="" loading="lazy">{% endif %}
  <span class="video-card-title">{{ include.talk.title }}</span>
  {% if include.talk.speaker_name %}<small>{{ include.talk.speaker_name }}</small>{% endif %}
</a>
